name: Update Labubu Data

on:
  schedule:
    - cron: '0 15 * * *'   # 每天北京时间 23:00（UTC 15:00）
  workflow_dispatch:         # 支持在 GitHub 页面手动触发

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 允许 push data.json
      pages: write           # 允许部署 GitHub Pages
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch data
        env:
          REDASH_API_KEY: ${{ secrets.REDASH_API_KEY }}
        run: python3 fetch.py

      - name: Commit data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
